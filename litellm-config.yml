x-mlx-gateway: &mlx-gateway
  api_base: http://host.docker.internal:5276/v1
  api_key: dummy
  # The gateway holds one model at a time; the first request after a swap has to load weights.
  timeout: 600
  stream_timeout: 600

model_list:
  - model_name: openai-api
    litellm_params:
      model: openai/claude-
      api_base: os.environ/OPENAI_BASE_URL
      api_key: os.environ/OPENAI_API_KEY

  - model_name: local-mlx
    litellm_params:
      model: openai/mlx-community/Qwen3.8-27B-4bit
      <<: *mlx-gateway

  - model_name: "mlx-community/*"
    litellm_params:
      model: "openai/mlx-community/*"
      <<: *mlx-gateway

  - model_name: "*"
    litellm_params:
      model: "openai/*"
      api_base: os.environ/OPENAI_BASE_URL
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  num_retries: 1
  default_fallbacks: ["local-mlx"]
