services:
  karl:
    build:
      context: .
      target: development
      args:
        PLATFORM: linux/amd64
        USER: $USERID
#    user: $UID
    working_dir: /app
    volumes:
      # Local code for dev
      - .:/app
      # 2. Map host Git credentials so the agent can use your SSH/Git config
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.ssh:/root/.ssh:ro
      # Mount the glab token/auth configuration
      - ~/.config/glab-cli:/root/.config/glab-cli:ro
      # Mount Obsidian's application support directory so the CLI can see vaults
      - ~/Library/Application Support/obsidian:$HOME/obsidian:ro
#      - /path/to/my/vault/clippings:/workspace/clippings:ro    # Read-Only
#      - /path/to/my/vault/wiki:/workspace/wiki:rw              # Read-Write
#      - /path/to/my/vault/memories:/workspace/memories:rw      # Read-Write
      # Blank out things I want to hide
#      - ./empty_mask_folder:/workspace/private:ro
    environment:
      - XDG_RUNTIME_DIR=$HOME/.config
      - PYTHONUNBUFFERED=1
      - BEEPER_TOKEN
      - OPENAI_API_KEY
      - OPENAI_API_BASE
      - SLACK_MCP_TOKEN
      - ATLASSIAN_BASE_URL
      - ATLASSIAN_USER
      - ATLASSIAN_API_TOKEN
      - TEST_NO_REAL
      - EMAIL_PASSWORD
      - TODOIST_TOKEN
      - GITLAB_URL
      - GITLAB_TOKEN
      - GOOGLE_API_KEY
      - TAVILY_API_KEY
      - CUSTOM_MCP_URLS
      - MATRIX_HOMESERVER
      - BOT_USER_ID
      - MY_MATRIX_ID
      - BOT_PASSWORD
    command: python -m karl bot

