[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "karl"
dependencies = [
    "langchain >= 1.3.0",
    "langchain-mcp-adapters",
    "typer",
    "rich",
    "pypdf",
    "langchain-ollama",
    "langchain-openai",
    "markdown-it-py",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
]

[project.optional-dependencies]
imap = ["imapclient"]
beeper = ["beeper_desktop_api"]
todoist = ["todoist_api_python"]
gitlab = ["python-gitlab"]
jira = ["jira", "atlassian-python-api"]
confluence = ["atlassian-python-api"]
tavily = ["langchain-tavily"]
matrix = ["matrix-nio"]
test = [
    "pytest",
    "pytest-pikachu",
    "pytest-asyncio",
    "pytest-recording",
    "testcontainers",
]

[tool.pytest]
addopts = ["--pikachu"]
testpaths = ["tests"]
