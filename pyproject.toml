[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "karl"
dependencies = [
    "langchain >= 1.4.0",
    "langchain-mcp-adapters",
    "deepagents",
    "typer",
    "rich",
    "pypdf",
    "langchain-ollama",
    "langchain-openai",
    "langchain-google-community",
    "google-auth-oauthlib",
    "markdown-it-py",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
    "mlx-lm",
    "mlx",
]

[project.optional-dependencies]
imap = ["imapclient"]
beeper = ["beeper_desktop_api"]
todoist = ["todoist_api_python"]
gitlab = ["python-gitlab"]
jira = ["jira", "atlassian-python-api"]
confluence = ["atlassian-python-api==4.0.4"]
tavily = ["langchain-tavily"]
matrix = ["matrix-nio", "markdown-it-py"]
mlx = [
    "mlx-lm",
    "mlx",
    "fastapi",
    "diffusers @ git+https://github.com/huggingface/diffusers@80c7ed262aeffbeb43ef13ae04baeb9b84515a69",
    "pydantic",
    "torch",
]
test = [
    "pytest",
    "pytest-pikachu",
    "pytest-asyncio",
    "pytest-recording",
    "testcontainers",
]

[tool.pytest]
addopts = ["--pikachu"]
testpaths = ["tests"]
