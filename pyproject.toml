[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">= 3.11"
dynamic = ["version"]
name = "karl"
dependencies = [
    "langchain >= 1.4.0",
    "fastmcp",
    "deepagents",
    "typer",
    "rich",
    "pypdf",
    "langchain-ollama",
    "langchain-openai",
    "langchain-google-community",
    "markdown-it-py",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
]

[project.optional-dependencies]
imap = ["imapclient"]
beeper = ["beeper_desktop_api"]
todoist = ["todoist_api_python"]
gitlab = ["python-gitlab"]
jira = ["jira", "atlassian-python-api"]
confluence = ["atlassian-python-api==4.0.4"]
tavily = ["langchain-tavily"]
mysql = ["pymysql"]
matrix = ["matrix-nio", "markdown-it-py"]
google = [
    "google-auth-oauthlib",
    "google-api-python-client",
    "google-auth",
    "analytics-mcp",
]
mlx = [
    "mlx-lm",
    "mlx",
    "fastapi",
    "pydantic",
]
test = [
    "pytest",
    "pytest-pikachu",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-recording",
    "testcontainers",
]

[tool.pytest]
addopts = [
    "--pikachu",
    "--import-mode=importlib",
    "--durations=10",
    "-n",
    "4",
]
testpaths = ["tests"]
asyncio_mode = "auto"
